<!doctype html>
<html lang="vi">
  <head>

    <title>Student - LetDiv</title>
    <link rel="icon" href="/assets/images/icon-logo-cropped.png" />
    <link

      integrity="sha512-SzlrxWUlpfuzQ+pcUCosxcglQRNAq/DZjVsC0lE40xsADsfeQoEypE+enwcOiGjk/bSuGGKHEyjSoQ1zVisanQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="/assets/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/student/css/student.css" />
    <link rel="stylesheet" href="/assets/css/notify.css" />

    <script src="/assets/js/role-guard.js" data-role="customer"></script>

          <div class="header-action">
            <div class="action">
              <div class="cart-bell">
                <button class="btn-bell">
                  <i class="fa-regular fa-bell"></i>
                </button>
              </div>
              <div class="cart-user">
                <button class="btn-user">
                  <i class="fa-regular fa-circle-user"></i>

              </div>
            </div>
          </div>
        </div>

    <div class="section-student">

        <div class="side-bar">
          <h2 class="title">HỌC TẬP</h2>
          <div class="nav">
            <a href="pages/tong-quan.html" target="content" class="active"

            <a href="pages/khoa-hoc-cua-toi.html" target="content"

              ><i class="fa-solid fa-chart-line"></i
              ><span>Kết quả học tập</span></a

              ><i class="fa-solid fa-receipt"></i

        <div class="main-content">
          <iframe
            src="pages/tong-quan.html"
            name="content"
            title="Khu vực học tập"
          ></iframe>
        </div>
      </div>

    <!-- Option 1: jQuery and Bootstrap Bundle (includes Popper) -->
    <script src="/assets/bootstrap/jquery.slim.min.js"></script>
    <script src="/assets/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/notify.js" data-role="student"></script>
