<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kết quả học tập - LetDiv Student</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css"
      integrity="sha512-SzlrxWUlpfuzQ+pcUCosxcglQRNAq/DZjVsC0lE40xsADsfeQoEypE+enwcOiGjk/bSuGGKHEyjSoQ1zVisanQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="../../assets/css/base.css" />
    <link rel="stylesheet" href="../../admin/css/pages.css" />
    <link rel="stylesheet" href="../css/pages-extra.css" />
  </head>
  <body>
    <main class="page">
      <div class="page-head">
        <div>
          <h1>Kết quả học tập</h1>
          <p>Điểm và nhận xét giảng viên đã chấm cho các bài tập bạn nộp. Bạn không thể tự sửa điểm.</p>
        </div>
      </div>

      <div class="stat-grid" id="stat-grid" style="grid-template-columns: repeat(3, 1fr)"></div>

      <div class="card" id="main-card">
        <div class="toolbar">
          <select id="filter-course" style="width: 260px"><option value="">Tất cả khóa học</option></select>
          <select id="filter-status" style="width: 180px">
            <option value="">Mọi trạng thái</option>
            <option value="graded">Đã chấm</option>
            <option value="pending">Chờ chấm</option>
          </select>
        </div>
        <div id="list-area"></div>
        <div class="table-foot" id="pager"></div>
      </div>
    </main>

    <!-- Chi tiết kết quả -->
    <div class="modal-overlay" id="result-modal">
      <div class="modal-box modal-lg">
        <div class="modal-header">
          <h3 id="result-title">Kết quả</h3>
          <button class="modal-close" data-close><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="modal-body" id="result-body"></div>
        <div class="modal-footer"><button class="btn btn-primary" data-close>Đóng</button></div>
      </div>
    </div>

    <script src="../../admin/js/seed-data.js"></script>
    <script src="../../admin/js/store.js"></script>
    <script src="../../assets/js/auth-store.js"></script>
    <script src="../../admin/js/ui.js"></script>
    <script src="../../assets/js/learning-store.js"></script>
    <script src="../js/student-store.js"></script>
    <script src="../js/student-ui.js"></script>
    <script src="../js/ket-qua-hoc-tap.js"></script>
  </body>
</html>
